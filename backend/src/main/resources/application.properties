# Database
spring.datasource.url=${DB_URL:${MYSQL_JDBC_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:dfsa}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:}}
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.continue-on-error=true

# File upload settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Upload directory for screenshots (outside the web root)
screenshot.upload.dir=${user.home}/dfsa-uploads

# OpenAPI (Swagger)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Session - use simple in-memory session (no extra DB table needed)
spring.session.store-type=none

# Initialize the database with schema and data
spring.sql.init.mode=always
spring.sql.init.platform=mysql

# Async configuration
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=25

# Logging
logging.level.org.springframework=info
logging.level.com.dfsa=debug

# Server port
server.port=${PORT:8091}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5188}
